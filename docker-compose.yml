version: '3.8'

services:
  postgres:
    container_name: postgres
    image: postgres
    restart: unless-stopped
    ports:
      - 5432:5432
    environment:
      POSTGRES_USER: evolution
      POSTGRES_PASSWORD: evolution
      POSTGRES_DB: evolution-db
      PGDATA: /data/postgres
    volumes:
      - ./data/pg:/data/postgres
  redis:
    container_name: redis
    image: redis:alpine
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - ./data/redis:/data
    restart: unless-stopped

volumes:
  evolution_store:
  evolution_instances: